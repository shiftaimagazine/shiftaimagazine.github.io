# 주간 메일 준비 + 구독 서버(Cloudflare Worker) 배포: _src/newsletter/worker/ 가 바뀌면 자동, 또는 손으로 실행.
# 저장소 비밀값은 두 개만: RESEND_API_KEY(Full access) · CLOUDFLARE_API_TOKEN('Cloudflare Workers 편집' 템플릿)
#  - Resend 도메인 등록·세그먼트 만들기·Cloudflare 하위 주소는 _src/newsletter/setup.py 가 한다(실행 요약에 포크번 DNS 레코드 표).
#  - 확인 링크 서명값은 처음 배포 때 무작위로 만들어 워커 비밀값에만 넣는다(어디에도 출력하지 않음, 이후 배포에서는 그대로 둠).
# 배포가 끝나면 서버 주소를 _src/newsletter/config.json 의 api 에 적어 커밋하고 build-site 를 돌린다.
name: newsletter-worker
on:
  push:
    branches: [main]
    paths: ['_src/newsletter/worker/**', '_src/newsletter/setup.py', '.github/workflows/newsletter-worker.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: newsletter-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: 비밀값 확인
        id: chk
        run: |
          miss=""
          for k in CLOUDFLARE_API_TOKEN RESEND_API_KEY; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::warning::저장소 비밀값이 아직 없습니다:$miss (안내서: _src/newsletter/SETUP.md). 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with: {node-version: '20'}
      - name: 시험
        if: steps.chk.outputs.skip != '1'
        run: node _src/newsletter/worker/test.mjs
      - name: Resend 도메인·세그먼트, Cloudflare 하위 주소 준비
        if: steps.chk.outputs.skip != '1'
        id: prep
        run: python3 -I _src/newsletter/setup.py
      - name: 배포
        if: steps.chk.outputs.skip != '1'
        working-directory: _src/newsletter/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.prep.outputs.account_id }}
          SEGMENT_ID: ${{ steps.prep.outputs.segment_id }}
        run: |
          npx --yes wrangler@4 deploy --var "SEGMENT_ID:$SEGMENT_ID"
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          if ! { npx --yes wrangler@4 secret list --format json 2>/dev/null || npx --yes wrangler@4 secret list 2>/dev/null; } | grep -q 'SIGNING_SECRET'; then
            openssl rand -hex 32 | tr -d '\n' | npx --yes wrangler@4 secret put SIGNING_SECRET
            echo "확인 링크 서명값을 새로 만들었습니다"
          fi
      - name: 서버 주소를 사이트 설정에 적기
        if: steps.chk.outputs.skip != '1'
        env:
          SUB: ${{ steps.prep.outputs.subdomain }}
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://shift-newsletter.$SUB.workers.dev"
          echo "서버 주소: $api"
          for i in 1 2 3 4 5 6; do curl -sf "$api/" | grep -q "SHIFT AI newsletter" && { echo "서버 응답 확인"; break; }; sleep 5; done
          python3 - "$api" <<'PY'
          import json, sys
          p = '_src/newsletter/config.json'; c = json.load(open(p))
          if c.get('api') != sys.argv[1]:
              c['api'] = sys.argv[1]; open(p, 'w').write(json.dumps(c, ensure_ascii=False, indent=2) + '\n'); print('config.json 바꿈')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _src/newsletter/config.json
          if git diff --cached --quiet; then echo "주소 그대로"; exit 0; fi
          git commit -m "메일 구독 서버 주소 연결 (자동)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          # 이 워크플로가 올린 커밋으로는 build-site 가 저절로 돌지 않아서(GitHub 규칙) 직접 실행한다
          gh workflow run build.yml --ref main

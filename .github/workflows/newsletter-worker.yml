# 메일 구독 서버(Cloudflare Worker)를 배포한다: _src/newsletter/worker/ 가 바뀌면 자동, 또는 손으로 실행.
# 저장소 비밀값: CLOUDFLARE_API_TOKEN(Workers 편집 권한) · CLOUDFLARE_ACCOUNT_ID · RESEND_API_KEY · RESEND_SEGMENT_ID · NEWSLETTER_SIGNING_SECRET
# 배포가 끝나면 서버 주소(…workers.dev)를 _src/newsletter/config.json 의 api 에 적어 커밋한다 → build-site 가 돌아 구독 칸이 그 주소로 연결된다.
name: newsletter-worker
on:
  push:
    branches: [main]
    paths: ['_src/newsletter/worker/**', '.github/workflows/newsletter-worker.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: newsletter-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
      SIGNING_SECRET: ${{ secrets.NEWSLETTER_SIGNING_SECRET }}
    steps:
      - name: 비밀값 확인
        id: chk
        run: |
          miss=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY RESEND_SEGMENT_ID SIGNING_SECRET; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::warning::저장소 비밀값이 아직 없습니다:$miss (안내서: _src/newsletter/SETUP.md). 배포를 건너뜁니다."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with: {node-version: '20'}
      - name: 시험
        if: steps.chk.outputs.skip != '1'
        run: node _src/newsletter/worker/test.mjs
      - name: 배포
        if: steps.chk.outputs.skip != '1'
        working-directory: _src/newsletter/worker
        run: |
          npx --yes wrangler@4 deploy --var "SEGMENT_ID:$RESEND_SEGMENT_ID"
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          printf '%s' "$SIGNING_SECRET" | npx --yes wrangler@4 secret put SIGNING_SECRET
      - name: 서버 주소를 사이트 설정에 적기
        if: steps.chk.outputs.skip != '1'
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          [ -n "$sub" ] || { echo "workers.dev 하위 주소를 못 읽음"; exit 1; }
          api="https://shift-newsletter.$sub.workers.dev"
          echo "서버 주소: $api"
          curl -sf "$api/" | grep -q "SHIFT AI newsletter" || echo "::warning::서버가 아직 응답하지 않습니다(배포 직후 몇 초 걸릴 수 있음)"
          python3 - "$api" <<'PY'
          import json, sys
          p = '_src/newsletter/config.json'; c = json.load(open(p))
          if c.get('api') != sys.argv[1]:
              c['api'] = sys.argv[1]; open(p, 'w').write(json.dumps(c, ensure_ascii=False, indent=2) + '\n'); print('config.json 바꿈')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _src/newsletter/config.json
          if git diff --cached --quiet; then echo "주소 그대로"; exit 0; fi
          git commit -m "메일 구독 서버 주소 연결 (자동)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          # 이 워크플로가 올린 커밋으로는 build-site 가 저절로 돌지 않아서(GitHub 규칙) 직접 실행한다
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

# 데일리 메일 발송: 사이트가 다시 만들어지면(build-site 끝) 다음 날 데일리 이슈 메일을 아침 7시(한국 시간)로 예약한다.
# 놓친 경우를 위해 매일 06:41(한국 시간)에도 한 번 확인한다. 같은 날 메일은 한 번만 간다(Resend 발송 이름 daily-YYYY-MM-DD 로 확인).
# 저장소 비밀값: RESEND_API_KEY · RESEND_SEGMENT_ID (없으면 경고만 남기고 끝냄). 안내서: _src/newsletter/SETUP.md
name: newsletter
on:
  workflow_run:
    workflows: [build-site]
    types: [completed]
  schedule:
    - cron: '41 21 * * *'
  workflow_dispatch:
    inputs:
      date: {description: '보낼 데일리 이슈 날짜(YYYY-MM-DD, 비우면 오늘·내일 중 최신)', required: false, default: ''}
      now: {description: '예약하지 않고 바로 보내기', type: boolean, default: false}
permissions:
  contents: read
concurrency:
  group: newsletter
  cancel-in-progress: false
jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: 메일 만들고 예약
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_NOW: ${{ github.event.inputs.now }}
        run: |
          python3 -I _src/assemble.py >/dev/null
          args=""
          if [ -n "$IN_DATE" ]; then case "$IN_DATE" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args="--date $IN_DATE";; *) echo "날짜 형식은 YYYY-MM-DD"; exit 1;; esac; fi
          [ "$IN_NOW" = "true" ] && args="$args --now"
          python3 -I _src/newsletter/send.py $args

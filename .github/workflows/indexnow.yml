# 사이트가 다시 만들어지면(build-site 끝) 새로 생기거나 바뀐 주소를 IndexNow 로 네이버·빙에 알린다.
# 손으로 돌릴 때(workflow_dispatch) all=yes 면 사이트맵 전체를 알린다.
name: indexnow
on:
  workflow_run:
    workflows: [build-site]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: '사이트맵 전체 알리기 (yes/no)'
        default: 'no'
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: 배포가 끝날 때까지 기다리기 (공개 사이트맵이 새 사이트맵과 같아질 때까지, 최대 6분)
        run: |
          for i in $(seq 1 36); do
            if curl -sf "https://shiftaimagazine.com/sitemap.xml?nocache=$(date +%s)" | cmp -s - sitemap.xml; then echo "배포 확인"; exit 0; fi
            sleep 10
          done
          echo "배포 확인이 안 됐지만 그대로 알립니다"
      - name: IndexNow 알리기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.all }}" = "yes" ]; then
            python3 _src/indexnow.py --all
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            python3 _src/indexnow.py "${{ github.event.workflow_run.head_sha }}"
          else
            python3 _src/indexnow.py HEAD~1
          fi

# 튜토리얼 사진: 위키미디어 공용에서 자유 이용 사진 찾기/받기(손으로 실행). 결과는 commons-tmp 가지(branch)에만 올린다(main·사이트에는 영향 없음).
name: commons-photos
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'search 또는 fetch', required: true, default: 'search'}
      queries: {description: '{"키": ["검색어", ...]} (search)', required: false, default: '{}'}
      picks: {description: '{"키": "File:..."} (fetch)', required: false, default: '{}'}
      focus: {description: '세로 위치 FOCUS_키=0~1 줄바꿈 대신 ; 로', required: false, default: ''}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow==11.0.0 requests==2.32.3
      - name: 실행
        env:
          QUERIES: ${{ github.event.inputs.queries }}
          PICKS: ${{ github.event.inputs.picks }}
          FOCUS: ${{ github.event.inputs.focus }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          # 입력은 환경 변수로만 받고(명령줄에 바로 넣지 않음), FOCUS_키=숫자·CONTAIN_키=값 모양만 내보낸다(보안 점검 11/2)
          for kv in $(echo "$FOCUS" | tr ';' ' '); do case "$kv" in FOCUS_*=*|CONTAIN_*=*) k="${kv%%=*}"; v="${kv#*=}"; [[ "$k" =~ ^[A-Za-z0-9_]+$ ]] && export "$k=$v";; esac; done
          case "$MODE" in search|fetch) ;; *) echo "mode 는 search 또는 fetch"; exit 1;; esac
          python3 .github/scripts/commons.py "$MODE"
      - name: 결과를 commons-tmp 가지에 올리기
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          mkdir -p /tmp/res && cp -r _cand _out /tmp/res/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan commons-tmp && git rm -rfq . && rm -rf ./* .github 2>/dev/null; cp -r /tmp/res/* . 2>/dev/null || true
          git add -A && git commit -qm "commons $MODE 결과" && git push -qf origin commons-tmp

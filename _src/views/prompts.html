<main id="v-prompts">
  <div class="ph"><h1>복붙 프롬프트 모음</h1><p>튜토리얼에 실린 프롬프트를 한곳에 모았습니다. 챗GPT·클로드·제미나이에 그대로 붙여 넣고, [ ] 자리만 내 상황으로 바꾸면 됩니다. 프롬프트마다 나온 글로 가는 링크가 있어 쓰는 법을 함께 볼 수 있습니다.</p></div>
  <div class="tfind"><input id="prQ" type="search" placeholder="프롬프트 검색 (예: 메일, 이력서, 엑셀, 회의)" aria-label="프롬프트 검색"><span id="prCount" class="tcount"></span></div>
  <div class="filters" id="prCats" role="group" aria-label="주제"></div>
  <p class="prtip">자주 쓸 프롬프트는 '내 함에 담기'를 눌러 <a href="/tools/prompt-box/">내 프롬프트함</a>에 모아 두면 [ ] 자리만 채워 바로 복사합니다. 처음부터 만들고 싶다면 <a href="/tools/prompt/">프롬프트 만들기</a>, 내가 쓴 프롬프트를 고치려면 <a href="/tools/prompt-check/">프롬프트 점검기</a>를 쓰세요.</p>
  <div class="prlist" id="prList"></div>
</main>

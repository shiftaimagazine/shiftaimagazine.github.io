t: JPG를\nPDF로
sub: 사진 여러 장을 고른 순서대로\nPDF 한 파일에 담습니다
---
<div class="row"><span class="badge b-pdf">PDF</span><span class="fname">사진모음.pdf</span><span class="meta">3쪽</span></div>
<div style="display:flex;justify-content:space-between">
  <div class="page" style="width:122px;height:172px;justify-content:center;padding:12px"><div class="pic" style="height:92px">{{photo:a}}</div></div>
  <div class="page" style="width:122px;height:172px;justify-content:center;padding:12px"><div class="pic" style="height:140px">{{photo:b}}</div></div>
  <div class="page" style="width:122px;height:172px;justify-content:center;padding:12px"><div class="pic" style="height:74px">{{photo:c}}</div></div>
</div>
<div style="display:flex;justify-content:space-between;padding:0 4px;margin-top:-6px;font-size:15px;font-weight:600;color:var(--mute)"><span style="width:114px;text-align:center">1쪽</span><span style="width:114px;text-align:center">2쪽</span><span style="width:114px;text-align:center">3쪽</span></div>
<div class="chips"><span class="chip">A4</span><span class="chip">여백 좁게</span><span class="chip">화질 보통</span></div>
<div class="btns"><span class="btn">PDF 만들기</span></div>

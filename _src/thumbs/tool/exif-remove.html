t: 위치정보\n지우기
sub: 사진 속 GPS·기종·날짜를 확인하고\n화질은 그대로 둔 채 지웁니다
---
<div class="row" style="gap:14px">
  <div style="width:58px;height:58px;border-radius:10px;overflow:hidden;flex:none">{{photo:b}}</div>
  <div style="flex:1;min-width:0"><div class="fname">IMG_2048.jpg</div><div class="meta" style="margin-top:2px">JPG · 화질 그대로</div></div>
</div>
<div class="label" style="margin-bottom:-6px">들어 있던 정보</div>
<div style="display:grid;grid-template-columns:118px 1fr;gap:10px 12px;font-size:18px;align-items:baseline">
  <span class="label" style="font-size:16px">위치(GPS)</span><span><span class="del">37.56631, 126.97789</span></span>
  <span class="label" style="font-size:16px">기기</span><span><span class="del">Apple iPhone 15 Pro</span></span>
  <span class="label" style="font-size:16px">찍은 날짜</span><span><span class="del">2026-11-01 13:05:22</span></span>
  <span class="label" style="font-size:16px">편집 프로그램</span><span><span class="del">18.1</span></span>
</div>
<div class="chips"><span class="chip ok">✓ 확인함 · 남은 정보 없음</span></div>
<div class="btns"><span class="btn">내려받기</span></div>

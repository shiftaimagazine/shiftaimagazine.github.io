t: PDF 합치기\n나누기
sub: 여러 PDF를 하나로 합치고\n필요한 쪽만 골라 뽑습니다
---
<div style="display:flex;flex-direction:column;gap:8px">
  <div class="row" style="background:var(--soft);border-radius:10px;padding:9px 12px"><span class="badge b-pdf">PDF</span><span class="fname" style="font-size:18px">견적서.pdf</span><span class="meta">2쪽</span></div>
  <div class="row" style="background:var(--soft);border-radius:10px;padding:9px 12px"><span class="badge b-pdf">PDF</span><span class="fname" style="font-size:18px">계약서.pdf</span><span class="meta">3쪽</span></div>
</div>
<div style="display:flex;justify-content:space-between">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="page" style="width:70px;height:94px;padding:7px;gap:5px;border-color:var(--ink);border-width:3px"><i class="t" style="height:7px"></i><i style="height:5px"></i><i style="height:5px;width:80%"></i><i style="height:5px"></i></div><b style="font-size:14px">✓ 1</b></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="page" style="width:70px;height:94px;padding:7px;gap:5px"><i class="t" style="height:7px;width:50%"></i><i style="height:5px"></i><i style="height:5px;width:70%"></i></div><span style="font-size:14px;font-weight:600;color:var(--faint)">2</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="page" style="width:70px;height:94px;padding:7px;gap:5px;border-color:var(--ink);border-width:3px"><i class="t" style="height:7px;width:60%"></i><i style="height:5px"></i><i style="height:5px"></i><i style="height:5px;width:60%"></i></div><b style="font-size:14px">✓ 3</b></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="page" style="width:70px;height:94px;padding:7px;gap:5px;border-color:var(--ink);border-width:3px"><i class="t" style="height:7px;width:45%"></i><i style="height:5px;width:85%"></i><i style="height:5px"></i></div><b style="font-size:14px">✓ 4</b></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="page" style="width:70px;height:94px;padding:7px;gap:5px"><i class="t" style="height:7px;width:65%"></i><i style="height:5px"></i><i style="height:5px;width:55%"></i></div><span style="font-size:14px;font-weight:600;color:var(--faint)">5</span></div>
</div>
<div class="chips sm"><span class="chip on">고른 쪽만 새 PDF로</span><span class="chip">고른 쪽 빼고 저장</span></div>
<div class="btns"><span class="btn">PDF 만들기</span></div>

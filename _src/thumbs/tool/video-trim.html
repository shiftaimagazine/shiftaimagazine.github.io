<div class="row" style="background:var(--soft);border-radius:10px;padding:10px 12px"><span class="badge b-jpg">MP4</span><span class="fname" style="font-size:18px">매장_촬영본.mov</span><span class="meta">0:48 · 186MB</span></div>

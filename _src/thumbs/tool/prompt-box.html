t: 내\n프롬프트함
sub: 자주 쓰는 프롬프트를 모아 두고\n빈칸만 채워 바로 복사합니다
---
<div class="head"><b>내 프롬프트함</b><span class="meta">4개 저장</span></div>
<div style="border:2px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px">
  <div class="row" style="justify-content:space-between"><span style="font-size:19px;font-weight:800">고객 메일 정중하게 답장</span><span class="chip" style="font-size:14px;padding:4px 10px">빈칸 3개</span></div>
  <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:16px">
    <span class="label" style="font-size:15px">회사명</span><span style="border:1px solid var(--edge);border-radius:8px;padding:7px 10px;font-weight:600">SHIFT 상사</span>
    <span class="label" style="font-size:15px">처리 기한</span><span style="border:1px solid var(--edge);border-radius:8px;padding:7px 10px;font-weight:600">11월 14일까지</span>
  </div>
  <div class="box wrap" style="font-size:16px;line-height:1.65;padding:11px 14px">
    <div>당신은 <mark>SHIFT 상사</mark> 고객지원 담당자입니다. 해결 방법과 처리 기한(<mark>11월 14일까지</mark>)을 분명히 적습니다.</div>
  </div>
</div>
<div class="btns"><span class="btn">복사하기</span></div>

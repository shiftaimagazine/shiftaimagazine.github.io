t: 표 사진\n→ 엑셀
sub: 사진 속 표를 칸 구조 그대로\n엑셀 파일로 만듭니다
---
<div style="display:flex;gap:12px;align-items:center">
  <div style="flex:none;width:150px;height:118px;border-radius:10px;background:#E9E4D8;transform:rotate(-3deg);padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(4,1fr);gap:0;border:2px solid #B9B1A0">
    <i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i><i style="border:1px solid #8C8476"></i>
  </div>
  <div style="font-size:30px;font-weight:900;color:var(--faint)">→</div>
  <div class="tbl" style="flex:1;font-size:15px">
    <div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr;background:var(--chip);font-weight:800"><span style="padding:6px 8px">품목</span><span style="padding:6px 8px">수량</span><span style="padding:6px 8px">금액</span></div>
    <div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr;border-top:1px solid var(--edge)"><span style="padding:6px 8px">사과</span><span style="padding:6px 8px;text-align:right">16</span><span style="padding:6px 8px;text-align:right">368,000</span></div>
    <div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr;border-top:1px solid var(--edge)"><span style="padding:6px 8px">배</span><span style="padding:6px 8px;text-align:right">9</span><span style="padding:6px 8px;text-align:right">135,000</span></div>
    <div style="display:grid;grid-template-columns:1.1fr 1fr 1.2fr;border-top:1px solid var(--edge)"><span style="padding:6px 8px;background:#FFF4C2">포노</span><span style="padding:6px 8px;text-align:right">5</span><span style="padding:6px 8px;text-align:right">115,000</span></div>
  </div>
</div>
<div class="row" style="justify-content:space-between;font-size:16px;font-weight:600;color:var(--mute)"><span>11줄 × 6칸 · 합친 칸 2곳</span><span class="chip ok" style="font-size:15px;padding:5px 12px">기울기 바로잡음</span></div>
<div class="chips sm"><span class="chip warn">노란 칸은 눌러서 고치기</span></div>
<div class="btns"><span class="btn">엑셀(.xlsx)로 받기</span></div>

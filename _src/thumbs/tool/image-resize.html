t: 이미지\n압축·자르기
sub: 용량을 줄이고 인스타 규격으로\n여러 장을 한 번에 자릅니다
---
<div class="chips sm"><span class="chip on">피드 세로 4:5</span><span class="chip">스토리·릴스 9:16</span><span class="chip">정사각형 1:1</span></div>
<div style="position:relative;height:212px;border-radius:12px;overflow:hidden">
  {{photo:c}}
  <div style="position:absolute;inset:0;background:rgba(22,23,27,.55);-webkit-mask:linear-gradient(#000,#000) 0 0/119px 100% no-repeat,linear-gradient(#000,#000) 100% 0/119px 100% no-repeat;mask:linear-gradient(#000,#000) 0 0/119px 100% no-repeat,linear-gradient(#000,#000) 100% 0/119px 100% no-repeat"></div>
  <div style="position:absolute;left:119px;right:119px;top:0;bottom:0;border:3px solid #fff;border-radius:4px"></div>
  <span style="position:absolute;left:131px;top:12px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;border-radius:6px;padding:3px 8px">1080×1350</span>
</div>
<div class="row" style="justify-content:space-between;font-size:16px;font-weight:600;color:var(--mute)"><span>꽉 채워 자르기 · JPG</span><span class="chip ok" style="font-size:15px;padding:5px 12px">1MB 이하</span></div>

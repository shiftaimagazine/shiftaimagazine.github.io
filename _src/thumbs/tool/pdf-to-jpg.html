t: PDF를\nJPG로
sub: 쪽마다 사진으로 저장하거나\n세로로 이어 한 장으로 만듭니다
---
<div class="row"><span class="badge b-pdf">PDF</span><span class="fname">회사소개서.pdf</span><span class="meta">3쪽</span></div>
<div style="display:flex;justify-content:space-between">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="page" style="width:122px;height:162px"><i class="t"></i><div class="pic" style="height:52px">{{photo:a}}</div><i></i><i style="width:80%"></i><i style="width:60%"></i></div>
    <div class="row" style="gap:6px"><span class="badge b-jpg" style="height:22px;font-size:12px;padding:0 6px">JPG</span><span style="font-size:14px;font-weight:700">회사소개서-1쪽</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="page" style="width:122px;height:162px"><i class="t" style="width:55%"></i><i></i><i style="width:90%"></i><i style="width:75%"></i><i></i><i style="width:65%"></i><i style="width:85%"></i></div>
    <div class="row" style="gap:6px"><span class="badge b-jpg" style="height:22px;font-size:12px;padding:0 6px">JPG</span><span style="font-size:14px;font-weight:700">회사소개서-2쪽</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="page" style="width:122px;height:162px"><i class="t" style="width:62%"></i><i style="width:85%"></i><div style="display:flex;align-items:flex-end;gap:5px;height:52px;padding-top:4px"><b style="flex:1;height:40%;background:#2A78D6;border-radius:3px 3px 0 0"></b><b style="flex:1;height:65%;background:#2A78D6;border-radius:3px 3px 0 0"></b><b style="flex:1;height:52%;background:#2A78D6;border-radius:3px 3px 0 0"></b><b style="flex:1;height:90%;background:#2A78D6;border-radius:3px 3px 0 0"></b></div><i></i><i style="width:70%"></i></div>
    <div class="row" style="gap:6px"><span class="badge b-jpg" style="height:22px;font-size:12px;padding:0 6px">JPG</span><span style="font-size:14px;font-weight:700">회사소개서-3쪽</span></div>
  </div>
</div>
<div class="chips"><span class="chip on">쪽마다 한 장</span><span class="chip">세로로 이어 한 장</span></div>
<div class="btns"><span class="btn">사진으로 바꾸기</span><span class="btn ghost">모두 ZIP으로 받기</span></div>

t: PDF 용량\n줄이기
sub: 글자는 그대로 두고\n사진만 줄여 가볍게
---
<div class="chips sm"><span class="chip on">글자 살리기 (추천)</span><span class="chip">쪽을 그림으로</span></div>
<div class="row" style="background:var(--soft);border-radius:10px;padding:10px 12px"><span class="badge b-pdf">PDF</span><span class="fname" style="font-size:18px">현장보고서.pdf</span><span class="meta">12쪽</span></div>
<div style="display:flex;align-items:flex-end;gap:14px;padding:4px 4px 0">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="label">원래</span><div style="height:118px;border-radius:10px;background:#F3D9D4;display:flex;align-items:flex-end;padding:10px 12px"><b style="font-size:30px;font-weight:900;color:var(--bad);letter-spacing:-.03em">48.2MB</b></div></div>
  <div style="font-size:30px;font-weight:900;color:var(--faint);padding-bottom:30px">→</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="label">줄인 뒤</span><div style="height:44px;border-radius:10px;background:var(--ok-bg);display:flex;align-items:center;padding:0 12px"><b style="font-size:24px;font-weight:900;color:var(--ok);letter-spacing:-.03em">3.1MB</b></div></div>
</div>
<div class="row" style="justify-content:space-between;font-size:16px;font-weight:600;color:var(--mute)"><span>사진 31장을 줄였습니다</span><span class="chip ok" style="font-size:15px;padding:5px 12px">93% 줄임</span></div>
<div class="btns"><span class="btn">PDF 줄이기</span></div>
